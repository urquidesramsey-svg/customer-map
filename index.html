<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>客户作战地图 V4.2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#17243a;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{background:#172b52;color:white;padding:23px 18px 18px}header small{color:#b9c9e5}h1{margin:5px 0;font-size:23px}main{padding:15px;max-width:760px;margin:auto}.card{background:white;border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:0 3px 15px #172b5210}.muted{color:#637089;font-size:13px}.tag{display:inline-block;background:#eaf0ff;color:#3159a0;border-radius:20px;padding:4px 9px;font-size:12px;margin:3px 4px 3px 0}button{border:0;background:#265ac0;color:white;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}button.secondary{background:#e9eef8;color:#234574}button.danger{background:#ffe8e8;color:#9c3030}input,textarea,select{width:100%;padding:11px;border:1px solid #d9e1ee;border-radius:9px;font:inherit;background:white;margin:5px 0 12px}textarea{min-height:105px;resize:vertical}label{font-size:13px;color:#52627b;font-weight:600}nav{position:fixed;bottom:0;background:white;display:flex;width:100%;border-top:1px solid #e2e8f3;padding:9px 0 max(9px,env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#6c7890;flex:1;padding:9px 2px;font-size:12px}nav button.on{color:#2156b8;background:#edf3ff}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{border-top:1px solid #eef1f6;padding:12px 0}.item:first-of-type{border:0}p{line-height:1.6;white-space:pre-wrap}summary{font-weight:600;cursor:pointer}details{margin-top:10px} .notice{background:#fff6e4;border-left:3px solid #eab14a;padding:10px;font-size:13px;border-radius:6px} .stat{font-size:27px;font-weight:800;color:#214f9b} .empty{color:#8c97a9;padding:15px 0} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .toolbar button{flex:1} .small{font-size:12px} .check{width:auto;margin:0 6px 0 0}</style></head><body><header><small>离线可用 · 数据只保存在当前浏览器</small><h1>客户作战地图 <span style="font-size:12px">V4.2</span></h1><div style="font-size:13px;color:#c6d4ef">公司 → 联系人 → 项目 → 下一步行动</div></header><main id="app"></main><nav id="nav"></nav><input type="file" id="importfile" accept=".json,application/json" hidden><script>
const KEY='crm_war_map_v4';const today='2026-10-13';const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={version:4,companies:[],people:[],projects:[],actions:[],visits:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=structuredClone(seed)};for(const k of ['companies','people','projects','actions','visits'])db[k]??=[];let tab='总览';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存失败，请立即导出备份：'+e.message)}};save();const cname=id=>db.companies.find(x=>x.id===id)?.name||'未关联公司';const pname=id=>db.people.find(x=>x.id===id)?.name||'未关联联系人';const opts=(items,value,label)=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(label(x))}</option>`).join('');
function render(){document.getElementById('nav').innerHTML=['总览','公司','联系人','项目','行动','备份'].map(x=>`<button class="${tab===x?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let h='';if(tab==='总览'){h=`<div class="card"><h2>客户全景</h2><div class="row">${[['公司',db.companies.length],['联系人',db.people.length],['项目',db.projects.length],['待办',db.actions.filter(x=>x.status!=='完成').length]].map(([a,b])=>`<div><div class="stat">${b}</div><div class="muted">${a}</div></div>`).join('')}</div></div><div class="card"><h2>近期回访</h2>${db.visits.slice().reverse().map(v=>`<div class="item"><b>${esc(v.date)} · ${esc(cname(v.companyId))}</b><div class="muted">${esc(pname(v.personId))} · ${esc(v.duration)}</div><p>${esc(v.summary)}</p><details><summary>复盘与下一步</summary><p>${esc(v.learning)}</p><p>${esc(v.next)}</p></details><button class="secondary" onclick="edit('visits','${v.id}')">编辑</button></div>`).join('')||'<p class="empty">暂无回访</p>'}<button onclick="edit('visits')">＋ 记录回访</button></div><div class="card notice">首次打开为空白客户库。请在「备份」中导入单独保存的客户资料 JSON；以后定期导出备份。</div>`}
if(tab==='公司')h=list('companies','公司档案',x=>`<div class="muted">${esc(x.region)} · ${esc(x.department)}</div><p><b>设备：</b>${esc(x.equipment)}</p><p><b>采购规则：</b>${esc(x.policy)}</p><details><summary>更多笔记</summary><p>${esc(x.notes)}</p></details>`);
if(tab==='联系人')h=list('people','联系人',x=>`<div class="muted">${esc(cname(x.companyId))} · ${esc(x.role)}</div><p>${esc(x.relationship)}</p><details><summary>详细信息</summary><p>电话：${esc(x.phone)}</p><p>${esc(x.notes)}</p></details>`);
if(tab==='项目')h=list('projects','项目 / 销售机会',x=>`<div class="muted">${esc(cname(x.companyId))} · ${esc(pname(x.contactId))}</div><span class="tag">${esc(x.stage)}</span><span class="tag">优先级：${esc(x.priority)}</span><p>${esc(x.details)}</p><details><summary>障碍与下一步</summary><p><b>障碍：</b>${esc(x.barriers)}</p><p><b>下一步：</b>${esc(x.next)}</p></details>`);
if(tab==='行动')h=list('actions','下一步行动',x=>`<div class="muted">${esc(cname(x.companyId))} · ${esc(x.due||'未定日期')}</div><span class="tag">${esc(x.status)}</span><p>${esc(x.notes)}</p><button class="secondary" onclick="toggle('${x.id}')">${x.status==='完成'?'改回待办':'✓ 标记完成'}</button>`);
if(tab==='备份')h=`<div class="card"><h2>数据备份与恢复</h2><p>所有数据保存在当前设备、当前浏览器中，不会自动同步到其他设备。清理浏览器数据、无痕模式或更换网址可能导致数据丢失。</p><div class="toolbar"><button onclick="exportData()">导出 JSON 备份</button><button class="secondary" onclick="chooseImport('replace')">覆盖导入</button><button class="secondary" onclick="chooseImport('merge')">增量导入 / 合并</button><button class="secondary" onclick="downloadExample()">下载增量包模板</button></div><p class="muted">「合并导入」保留现有记录，添加新记录；同一记录以当前手机内容为准，尽量补充空字段。合并前自动下载当前备份。「覆盖导入」会替换全部内容。支持 V4 / V4.2 备份。</p></div><div class="card"><h2>安全操作</h2><button class="secondary" onclick="exportData()">立即备份</button> <button class="danger" onclick="resetData()">清空全部数据</button><p class="muted">本地数据不加密。请妥善保存包含客户信息的 JSON 文件。</p></div>`;
document.getElementById('app').innerHTML=h}
function list(kind,title,body){return `<div class="card"><div class="row"><h2 style="flex:3">${title}</h2><button onclick="edit('${kind}')">＋ 新增</button></div>${db[kind].map(x=>`<div class="item"><b>${esc(x.name||x.title)}</b>${body(x)}<div class="toolbar"><button class="secondary" onclick="edit('${kind}','${x.id}')">编辑</button><button class="danger" onclick="removeItem('${kind}','${x.id}')">删除</button></div></div>`).join('')||'<p class="empty">暂无记录</p>'}</div>`}
const schema={companies:[['name','公司名称'],['region','城市/地区'],['department','部门'],['equipment','现有设备与数量','textarea'],['policy','采购限制/准入','textarea'],['notes','补充笔记','textarea']],people:[['companyId','所属公司','company'],['name','联系人姓名'],['role','岗位/职责'],['phone','电话'],['relationship','关系与沟通情况','textarea'],['notes','其他信息','textarea']],projects:[['companyId','所属公司','company'],['name','项目/机会名称'],['stage','阶段'],['contactId','关联联系人','person'],['priority','优先级'],['details','需求/事实','textarea'],['barriers','障碍/待核实','textarea'],['next','下一步','textarea']],actions:[['companyId','所属公司','company'],['projectId','关联项目','project'],['title','行动事项'],['due','计划日期','date'],['status','状态'],['notes','备注','textarea']],visits:[['companyId','所属公司','company'],['personId','联系人','person'],['date','日期','date'],['duration','时间/时长'],['summary','现场事实','textarea'],['learning','复盘/经验','textarea'],['next','下一步','textarea']]};
function edit(kind,id){const obj=db[kind].find(x=>x.id===id)||{id:uid()};const fields=schema[kind].map(([key,label,type])=>{let input;if(type==='textarea')input=`<textarea name="${key}">${esc(obj[key])}</textarea>`;else if(['company','person','project'].includes(type)){const items=type==='company'?db.companies:type==='person'?db.people:db.projects;input=`<select name="${key}"><option value="">请选择</option>${opts(items,obj[key],x=>x.name||x.title)}</select>`}else input=`<input name="${key}" type="${type==='date'?'date':'text'}" value="${esc(obj[key])}">`;return `<label>${label}</label>${input}`}).join('');document.getElementById('app').innerHTML=`<div class="card"><h2>${id?'编辑':'新增'} · ${kind}</h2><form id="editform">${fields}<div class="toolbar"><button type="submit">保存</button><button type="button" class="secondary" onclick="render()">取消</button></div></form></div>`;document.getElementById('editform').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(kind!=='visits'&&!data.name&&!data.title){alert('请填写名称或事项');return}if(id)Object.assign(obj,data);else db[kind].push({...obj,...data});save();render()}}
function removeItem(kind,id){if(confirm('确定删除？此操作不可撤销，请先备份。')){db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function toggle(id){let x=db.actions.find(a=>a.id===id);x.status=x.status==='完成'?'待办':'完成';save();render()}
function exportData(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='客户作战地图备份_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
let importMode='merge';
const KINDS=['companies','people','projects','actions','visits'];
const KIND_LABEL={companies:'公司',people:'联系人',projects:'项目',actions:'行动',visits:'回访'};
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,'')}
function chooseImport(mode){importMode=mode;document.getElementById('importfile').click()}
function validateImport(d,complete){
 if(!d||typeof d!=='object'||Array.isArray(d))throw Error('JSON 顶层应为对象');
 if(complete&&!KINDS.every(k=>Array.isArray(d[k])))throw Error('覆盖导入必须是包含五类数据的完整备份');
 if(!KINDS.some(k=>Array.isArray(d[k])))throw Error('没有找到可导入的资料数组');
 for(const k of KINDS){if(d[k]!==undefined&&(!Array.isArray(d[k])||d[k].some(x=>!x||typeof x!=='object'||Array.isArray(x))))throw Error(k+' 格式不正确')}
}
function identity(kind,x){
 const name=norm(x.name||x.title);
 if(kind==='companies')return name;
 if(kind==='people'||kind==='projects')return norm(x.companyId)+'|'+name;
 if(kind==='actions')return norm(x.companyId)+'|'+norm(x.projectId)+'|'+name;
 return norm(x.companyId)+'|'+norm(x.personId)+'|'+norm(x.date)+'|'+norm(x.summary);
}
function buildMerge(current,incoming,overwrite){
 const result=structuredClone(current),maps={},stats={added:{},matched:{},updated:{},unlinked:[]};
 for(const k of KINDS){result[k]??=[];maps[k]=new Map();stats.added[k]=0;stats.matched[k]=0;stats.updated[k]=0}
 const findName=(kind,name,companyId)=>result[kind].find(z=>norm(z.name||z.title)===norm(name)&&(!companyId||z.companyId===companyId));
 const resolve=(kind,id,name,companyId)=>{
   if(id&&maps[kind].has(String(id)))return maps[kind].get(String(id));
   if(id&&result[kind].some(z=>String(z.id)===String(id)))return id;
   if(name){const z=findName(kind,name,companyId);if(z)return z.id}
   return '';
 };
 for(const kind of KINDS){
  for(const raw of incoming[kind]||[]){
   const x={...raw},oldId=String(x.id||'');
   if(kind!=='companies'){
    x.companyId=resolve('companies',x.companyId,x.companyName);
    if(!x.companyId)stats.unlinked.push(KIND_LABEL[kind]+'：'+(x.name||x.title||x.summary||'未命名')+'（公司未匹配）');
   }
   if(kind==='projects')x.contactId=resolve('people',x.contactId,x.contactName,x.companyId);
   if(kind==='actions')x.projectId=resolve('projects',x.projectId,x.projectName,x.companyId);
   if(kind==='visits')x.personId=resolve('people',x.personId,x.personName||x.contactName,x.companyId);
   // Auxiliary name fields are import hints, not persisted data.
   for(const key of ['companyName','contactName','projectName','personName'])delete x[key];
   const key=identity(kind,x);
   let match=result[kind].find(y=>key&&key.replace(/\|/g,'')&&identity(kind,y)===key);
   if(!match&&oldId){const byId=result[kind].find(y=>String(y.id)===oldId);if(byId&&identity(kind,byId)===key)match=byId}
   if(match){
    stats.matched[kind]++;if(oldId)maps[kind].set(oldId,match.id);
    for(const [field,value] of Object.entries(x)){
     if(field==='id'||field==='companyId'||field==='contactId'||field==='projectId'||field==='personId'||value===undefined||value===null||value==='')continue;
     if((match[field]===undefined||match[field]===null||match[field]==='')||overwrite){
      if(match[field]!==value){match[field]=value;stats.updated[kind]++}
     }
    }
   }else{
    if(!x.id||result[kind].some(y=>String(y.id)===String(x.id)))x.id=uid();
    if(oldId)maps[kind].set(oldId,x.id);
    result[kind].push(x);stats.added[kind]++;
   }
  }
 }
 return {result,stats};
}
function downloadExample(){
 const sample={format:'客户作战地图增量包',version:'4.2',companies:[{id:'new-company',name:'示例公司',region:'示例城市',notes:'仅供演示，请替换为实际内容'}],people:[{name:'示例联系人',companyName:'示例公司',role:'质量部门'}],projects:[{name:'示例项目',companyName:'示例公司',contactName:'示例联系人',stage:'线索',details:'尚待确认'}],actions:[{title:'确认项目需求',companyName:'示例公司',projectName:'示例项目',status:'待办'}],visits:[]};
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(sample,null,2)],{type:'application/json'}));a.href=url;a.download='客户作战地图_增量包模板.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.getElementById('importfile').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const data=JSON.parse(await f.text());validateImport(data,importMode==='replace');
  if(importMode==='replace'){
   if(!confirm('覆盖导入会替换全部数据，确定继续？操作前将自动下载当前备份。'))return;
   exportData();db=data;save();render();alert('覆盖导入成功');return;
  }
  const before=buildMerge(db,data,false),preview=before.stats;
  const line=k=>KIND_LABEL[k]+'：新增 '+preview.added[k]+'，匹配 '+preview.matched[k];
  const summary=KINDS.map(line).join('\n');
  const warnings=preview.unlinked.length?'\n\n⚠ 未能关联公司（会作为未关联记录导入）：\n'+preview.unlinked.slice(0,5).join('\n'):'';
  const choice=prompt('增量导入预览：\n'+summary+warnings+'\n\n输入 1：只新增并补齐空字段（推荐）\n输入 2：同名记录也更新非空字段\n输入 0：取消','1');
  if(choice!=='1'&&choice!=='2')return;
  const {result,stats}=choice==='2'?buildMerge(db,data,true):before;
  if(!confirm('确认导入？将自动导出当前备份。\n'+KINDS.map(k=>KIND_LABEL[k]+' 新增 '+stats.added[k]+'，匹配 '+stats.matched[k]+'，字段更新 '+stats.updated[k]).join('\n')))return;
  exportData();db=result;save();render();alert('导入成功！请进入对应栏目检查关联与字段。');
 }catch(err){alert('导入失败，数据未修改：'+err.message)}finally{e.target.value=''}
};
function resetData(){if(confirm('确定清空当前所有内容？请先导出备份。')){db=structuredClone(seed);save();render()}}render();
</script></body></html>
